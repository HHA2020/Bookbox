services:
  # ── Backend Next.js API ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: bookbox_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI}
    expose:
      - "3001"

  # ── Frontend Next.js SSR ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Set NEXT_PUBLIC_API_URL to your VM's public IP/domain at build time:
        #   NEXT_PUBLIC_API_URL=http://<your-vm-ip>/backend/api docker compose up --build
        # Defaults to a relative path (browser-side only — SSR needs the full URL).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend/api}
    container_name: bookbox_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bookbox_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend